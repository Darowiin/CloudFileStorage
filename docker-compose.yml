services:
  app:
    build:
      context: .
    container_name: file_storage_container
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - rustfs
    ports:
      - '8080:8080'

  db:
    image: postgres:17-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.10.3-alpine
    container_name: redis_container
    ports:
      - "6379:6379"
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: rustfs_container
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
    volumes:
      - ./rustfs-data:/data
    command: --console-enable /data
    restart: unless-stopped

  frontend:
    build:
      context: ./roadmap-cloud-storage-frontend
      dockerfile: Dockerfile
    container_name: frontend_container
    ports:
      - "80:80"
    depends_on:
      - app
    environment:
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  pgdata:
  rustfs-data: